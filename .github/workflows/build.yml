name: build

on:
  push:
    branches:
      - main
      - 'claude/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Verificar firma Authenticode de lib
        shell: pwsh
        run: |
          $failed = $false
          foreach ($name in 'Microsoft.Web.WebView2.Core.dll', 'Microsoft.Web.WebView2.WinForms.dll', 'WebView2Loader.dll') {
            $sig = Get-AuthenticodeSignature -FilePath (Join-Path 'lib' $name)
            $subject = if ($sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { '' }
            '{0,-40} {1,-8} {2}' -f $name, $sig.Status, $subject
            if ($sig.Status -ne 'Valid' -or $subject -notmatch 'O=Microsoft Corporation') { $failed = $true }
          }
          if ($failed) { throw 'Firma Authenticode invalida en lib/' }

      - name: Calcular version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $v = $env:GITHUB_REF_NAME.TrimStart('v') } else { $v = "1.0.$env:GITHUB_RUN_NUMBER" }
          "value=$v" >> $env:GITHUB_OUTPUT
          "Version $v"

      - name: Firma de codigo (opcional)
        if: ${{ vars.MUROSOC_SIGNING == 'true' }}
        shell: pwsh
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODESIGN_PFX_BASE64))
          "MUROSOC_PFX=$pfx" >> $env:GITHUB_ENV
          "MUROSOC_SIGN_CMD=pwsh -NoProfile -File .github\scripts\sign.ps1" >> $env:GITHUB_ENV

      - name: Compilar
        shell: cmd
        env:
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
          CODESIGN_TIMESTAMP_URL: ${{ vars.CODESIGN_TIMESTAMP_URL }}
        run: build.cmd ${{ steps.version.outputs.value }}

      - name: Limpiar certificado
        if: ${{ always() && vars.MUROSOC_SIGNING == 'true' }}
        shell: pwsh
        run: if ($env:MUROSOC_PFX -and (Test-Path $env:MUROSOC_PFX)) { Remove-Item -Force $env:MUROSOC_PFX }

      - name: Hashes del paquete
        shell: pwsh
        run: Get-Content "dist\MuroSOC-${{ steps.version.outputs.value }}-SHA256SUMS.txt"

      - name: Crear release
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          APPVER: ${{ steps.version.outputs.value }}
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'release'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "dist\MuroSOC-$env:APPVER.zip" $stage
          Copy-Item "dist\MuroSOC-$env:APPVER-SHA256SUMS.txt" (Join-Path $stage 'SHA256SUMS.txt')
          $tag = "v$env:APPVER"
          $notes = "Build $env:APPVER del commit $env:GITHUB_SHA.`n`nVerifica el zip con SHA256SUMS.txt antes de usarlo."
          gh release create $tag (Join-Path $stage "MuroSOC-$env:APPVER.zip") (Join-Path $stage 'SHA256SUMS.txt') --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Muro SOC $env:APPVER" --notes $notes
